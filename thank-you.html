<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Message Sent — Mr. Ayaan Portfolio</title>
  <link rel="icon" type="image/png" href="profile_circle.png" />
  <link rel="stylesheet" href="css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    .thank-you-wrap {
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .thank-you-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 3rem 2rem;
      max-width: 480px;
      width: 100%;
    }
    .thank-you-icon {
      font-size: 3.5rem;
      margin-bottom: 1rem;
    }
    .thank-you-card h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      margin-bottom: 0.8rem;
      color: var(--accent);
    }
    .thank-you-card p {
      color: var(--text-muted);
      margin-bottom: 2rem;
      line-height: 1.6;
    }
    .thank-you-card .btn {
      display: inline-block;
      text-decoration: none;
      padding: 0.7rem 2rem;
      border-radius: 10px;
      font-weight: 500;
      background: var(--accent);
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="thank-you-wrap">
    <div class="thank-you-card">
      <div class="thank-you-icon">&#10003;</div>
      <h2>Message Sent!</h2>
      <p>Thank you for reaching out. I'll get back to you as soon as possible.</p>
      <a href="/" class="btn">Back to Portfolio</a>
    </div>
  </div>
</body>
</html>
